<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sixth Ward Tool Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dist/styles.css">
</head>
<body class="min-h-screen bg-surface font-body text-ink antialiased">
  <header class="border-b border-border bg-surface-raised">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-md py-md">
      <a class="font-display text-lg font-semibold text-ink" href="index.html">Sixth Ward Tool Library</a>
      <a class="rounded-sm px-sm py-xs text-sm font-medium text-accent hover:text-accent-hover hover:underline" href="#catalog">Catalog</a>
    </div>
  </header>

  <main id="catalog" class="mx-auto max-w-6xl px-md py-xl">
    <div class="mb-lg max-w-2xl">
      <p class="mb-xs text-sm font-medium uppercase tracking-wide text-accent">Borrow, build, repair</p>
      <h1 class="font-display text-xl font-semibold">Tools for your next project</h1>
      <p class="mt-sm text-base text-ink-muted">Browse the Sixth Ward collection and find the right tool before you walk over.</p>
    </div>
    <div id="catalog-grid" class="grid grid-cols-1 gap-lg md:grid-cols-3" aria-label="Tool catalog"></div>
  </main>

  <script>
    const catalogGrid = document.querySelector("#catalog-grid");
    const availabilityLabels = {
      available: "Available",
      checked_out: "Checked out",
      repair: "Under repair"
    };
    const availabilityClasses = {
      available: "bg-status-available-bg text-status-available",
      checked_out: "bg-status-out-bg text-status-out",
      repair: "bg-status-repair-bg text-status-repair"
    };
    const getStatusDetail = (tool) => {
      if (tool.availability === "checked_out") {
        const dueBack = new Date(`${tool.due_back}T00:00:00`);
        return `Due back ${dueBack.toLocaleDateString("en-US", { month: "long", day: "numeric" })}`;
      }
      if (tool.availability === "repair") return "Currently unavailable";

      const details = [];
      if (tool.members_only) details.push("Members only");
      if (tool.requires_orientation) details.push("Orientation required");
      if (tool.deposit > 0) details.push(`Deposit $${tool.deposit}`);
      return details.length ? details.join(". ") : "No deposit";
    };

    fetch("data/tools.json")
      .then((response) => {
        if (!response.ok) throw new Error(`Catalog request failed: ${response.status}`);
        return response.json();
      })
      .then((catalog) => {
        const categories = new Map(catalog.categories.map((category) => [category.id, category.label]));
        catalogGrid.innerHTML = catalog.tools
          .filter((tool) => tool.availability !== "retired")
          .map((tool) => `
            <a href="tool.html?id=${encodeURIComponent(tool.id)}" class="group flex flex-col rounded-card border border-border bg-surface-raised transition hover:-translate-y-xs hover:border-accent hover:shadow-md">
              <div class="flex aspect-[4/3] w-full items-center justify-center bg-surface">
                <img src="images/${tool.category}.svg" alt="" class="size-xl" width="40" height="40">
              </div>
              <p class="mx-md mt-lg text-xs font-medium uppercase tracking-wide text-ink-muted">${categories.get(tool.category)}</p>
              <h2 class="mx-md mt-xs font-display text-lg font-semibold group-hover:text-accent">${tool.name}</h2>
              <span class="mx-md mt-sm self-start rounded-full px-sm py-xs text-xs font-medium ${availabilityClasses[tool.availability]}">${availabilityLabels[tool.availability]}</span>
              <p class="mx-md mb-md mt-sm text-sm text-ink">${getStatusDetail(tool)}</p>
            </a>
          `)
          .join("");
      })
      .catch((error) => {
        catalogGrid.innerHTML = '<p class="text-sm text-ink-muted">The catalog is currently unavailable. Please refresh and try again.</p>';
        console.error(error);
      });
  </script>
</body>
</html>
